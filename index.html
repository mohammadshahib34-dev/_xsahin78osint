<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6d5efc">
<title>RC ↔ Mobile · vehicle & mobile lookup</title>
<style>
  :root{
    --rcm-fg: var(--host-fg, #14161c);
    --rcm-muted: var(--host-fg-muted, #6b7280);
    --rcm-card: var(--host-card, #ffffff);
    --rcm-card-fg: var(--host-card-fg, #14161c);
    --rcm-border: var(--host-border, #e7e9ef);
    --rcm-border-hover: var(--host-border-hover, #c9cddb);
    --rcm-input: var(--host-input, #f6f7fb);
    --rcm-soft: var(--host-muted, #f3f4f8);
    --rcm-accent: var(--host-primary, #6d5efc);
    --rcm-ok: var(--host-success, #12a150);
    --rcm-bad: var(--host-error, #e5484d);
    --rcm-warn: #d97706;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --rcm-fg: var(--host-fg, #eceef4);
      --rcm-muted: var(--host-fg-muted, #9aa0b0);
      --rcm-card: var(--host-card, #16181f);
      --rcm-card-fg: var(--host-card-fg, #eceef4);
      --rcm-border: var(--host-border, #262a35);
      --rcm-input: var(--host-input, #1a1d25);
      --rcm-soft: var(--host-muted, #1e212a);
      --rcm-accent: var(--host-primary, #8b7dff);
      --rcm-warn: #f0b429;
    }
  }

  *{ box-sizing: border-box; }
  [hidden]{ display: none !important; }
  body{
    margin: 0;
    background: var(--host-bg, #fbfbfd);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", monospace; }

  .app{
    max-width: 660px;
    margin: 0 auto;
    padding: 12px 6px 26px;
    color: var(--rcm-fg);
    font-size: 14px;
    line-height: 1.5;
  }

  /* ---------- header ---------- */
  .head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
  .brand{ display:flex; align-items:center; gap:11px; min-width:0; }
  .logo{
    width:38px; height:38px; flex:none; border-radius:11px;
    display:grid; place-items:center;
    background: var(--rcm-accent); color:#fff;
  }
  .brand h1{ font-size:17px; font-weight:600; margin:0; letter-spacing:-.2px; }
  .brand p{ margin:1px 0 0; font-size:12px; color: var(--rcm-muted); }
  .pill{
    font-size:11.5px; padding:5px 10px; border-radius:999px;
    border:1px solid var(--rcm-border); background: var(--rcm-card);
    color: var(--rcm-muted); white-space:nowrap;
  }
  .pill::before{
    content:""; display:inline-block; width:6px; height:6px; border-radius:50%;
    background: var(--rcm-ok); margin-right:6px; vertical-align:middle;
  }

  /* ---------- tabs ---------- */
  .tabs{
    display:flex; gap:4px; padding:4px; border-radius:12px;
    background: var(--rcm-soft); border:1px solid var(--rcm-border); margin-bottom:12px;
  }
  .tab{
    flex:1; appearance:none; border:0; background:transparent; color: var(--rcm-muted);
    font:inherit; font-weight:500; padding:9px 10px; border-radius:9px; cursor:pointer;
    transition: color .15s, background .15s;
  }
  .tab:hover{ color: var(--rcm-fg); }
  .tab.active{ background: var(--rcm-card); color: var(--rcm-accent); }

  /* ---------- search ---------- */
  .searchbar{ display:flex; gap:8px; }
  .input{
    flex:1; min-width:0; font:inherit; font-size:16px; padding:12px 14px;
    border-radius:12px; background: var(--rcm-input); border:1px solid var(--rcm-border);
    color: var(--rcm-fg); outline:none; letter-spacing:.4px;
    transition: border-color .15s, box-shadow .15s;
  }
  .input::placeholder{ color: var(--rcm-muted); opacity:.7; letter-spacing:.4px; }
  .input:focus{
    border-color: var(--rcm-accent);
    box-shadow: 0 0 0 3px rgba(109,94,252,.16);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--rcm-accent) 22%, transparent);
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    font:inherit; font-weight:500; font-size:14px; padding:12px 20px;
    border-radius:12px; border:0; cursor:pointer; text-decoration:none;
    background: var(--rcm-accent); color:#fff; white-space:nowrap;
    transition: opacity .15s, transform .05s;
  }
  .btn:hover{ opacity:.9; }
  .btn:active{ transform: translateY(1px); }
  .btn:disabled{ opacity:.6; cursor:default; }
  .btn.ghost{ background: var(--rcm-card); color: var(--rcm-fg); border:1px solid var(--rcm-border); }
  .btn.ghost:hover{ border-color: var(--rcm-border-hover); opacity:1; }
  .btn.sm{ padding:7px 11px; font-size:12px; border-radius:9px; }

  .hint{ margin:9px 2px 0; font-size:12.5px; color: var(--rcm-muted); min-height:18px; }
  .hint.bad{ color: var(--rcm-bad); }
  .hint b{ font-weight:500; }
  .linkbtn{
    background:none; border:0; padding:0; font:inherit; font-size:12.5px;
    color: var(--rcm-accent); cursor:pointer; text-decoration:underline; text-underline-offset:2px;
  }

  /* ---------- results ---------- */
  .out{ margin-top:16px; }
  .card{
    background: var(--rcm-card); border:1px solid var(--rcm-border); border-radius:16px;
    padding:18px; color: var(--rcm-card-fg);
  }
  .k{
    font-size:11.5px; letter-spacing:.5px; text-transform:uppercase;
    color: var(--rcm-muted); font-weight:500;
  }
  .big{ font-size:26px; font-weight:600; letter-spacing:-.2px; margin:6px 0 3px; }
  .vsub{ font-size:12.5px; color: var(--rcm-muted); }
  .row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .actions{ margin-top:15px; display:flex; gap:8px; flex-wrap:wrap; }
  .meta{
    margin-top:13px; font-size:12px; color: var(--rcm-muted);
    display:flex; gap:14px; flex-wrap:wrap;
  }

  .vcard{
    background: var(--rcm-card); border:1px solid var(--rcm-border); border-radius:16px;
    padding:16px; color: var(--rcm-card-fg); margin-top:10px;
  }
  .vhead{ display:flex; justify-content:space-between; gap:12px; align-items:flex-start; flex-wrap:wrap; }
  .reg{ font-size:19px; font-weight:600; letter-spacing:.7px; }
  .vcard .vsub{ margin-top:3px; }
  .badge{
    font-size:11px; padding:4px 9px; border-radius:999px;
    border:1px solid var(--rcm-border); color: var(--rcm-muted);
  }
  .grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap:8px; margin-top:14px; }
  .chip{ border:1px solid var(--rcm-border); border-radius:11px; padding:9px 11px; background: var(--rcm-soft); }
  .chip .cl{ font-size:11px; color: var(--rcm-muted); font-weight:500; }
  .chip .cv{ font-size:13px; font-weight:500; margin-top:2px; }
  .chip .cs{ font-size:11px; margin-top:2px; color: var(--rcm-muted); }
  .chip.ok .cv{ color: var(--rcm-ok); }
  .chip.warn .cv{ color: var(--rcm-warn); }
  .chip.bad .cv{ color: var(--rcm-bad); }

  .empty{
    text-align:center; padding:26px 16px; border:1px dashed var(--rcm-border);
    border-radius:16px; color: var(--rcm-muted); font-size:13px;
  }
  .empty .t{ color: var(--rcm-fg); font-weight:500; margin-bottom:4px; font-size:14px; }

  .sk{ border-radius:7px; background: var(--rcm-soft); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:.5; } 50%{ opacity:1; } }

  /* ---------- history ---------- */
  .hist{ margin-top:24px; }
  .hrow{ display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; }
  .chips{ display:flex; flex-wrap:wrap; gap:7px; }
  .hchip{
    font:inherit; font-size:12.5px; padding:6px 11px; border-radius:999px;
    background: var(--rcm-card); border:1px solid var(--rcm-border); color: var(--rcm-fg);
    cursor:pointer; display:inline-flex; gap:7px; align-items:center;
  }
  .hchip:hover{ border-color: var(--rcm-border-hover); }
  .hchip .dir{ color: var(--rcm-muted); font-size:11px; }

  /* ---------- footer ---------- */
  .foot{
    margin-top:26px; padding-top:12px; border-top:1px solid var(--rcm-border);
    font-size:11.5px; color: var(--rcm-muted);
    display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .foot b{ font-weight:500; }
</style>
</head>
<body>

<div class="app">

  <header class="head">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8h12l-3-3"></path>
          <path d="M20 16H8l3 3"></path>
        </svg>
      </div>
      <div>
        <h1>RC &harr; Mobile</h1>
        <p>Vehicle number aur mobile number ke beech lookup</p>
      </div>
    </div>
    <span class="pill" id="quota">live api</span>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab active" type="button" data-mode="rc2m" role="tab" aria-selected="true">RC &rarr; mobile</button>
    <button class="tab" type="button" data-mode="m2rc" role="tab" aria-selected="false">Mobile &rarr; RC</button>
  </div>

  <div class="searchbar">
    <input id="q" class="input mono" type="text" autocomplete="off" spellcheck="false" placeholder="GJ05RS0030" aria-label="Search value">
    <button id="go" class="btn" type="button">Search</button>
  </div>
  <div class="hint" id="hint"></div>

  <section class="out" id="out" aria-live="polite"></section>

  <section class="hist" id="histWrap" hidden>
    <div class="hrow">
      <span class="k">Recent searches</span>
      <button class="linkbtn" id="clearHist" type="button">clear</button>
    </div>
    <div class="chips" id="hist"></div>
  </section>

  <footer class="foot">
    <span>api by <b>@kzr0x</b> &middot; powered by Patch Verse</span>
    <span>data: vahan / rc records</span>
  </footer>

</div>

<script>
(function () {
  'use strict';

  var API = 'https://candy-finger-offers-wright.trycloudflare.com';
  var KEY = 'api-by-kzr0x-FRDBcQSRbkUXFi_w';
  var TIMEOUT_MS = 25000;
  var HIST_KEY = 'rcm.history.v1';
  var MAX_HIST = 8;

  var mode = 'rc2m';
  var busy = false;

  var q = document.getElementById('q');
  var go = document.getElementById('go');
  var hint = document.getElementById('hint');
  var out = document.getElementById('out');
  var quota = document.getElementById('quota');
  var histWrap = document.getElementById('histWrap');
  var histBox = document.getElementById('hist');
  var clearHistBtn = document.getElementById('clearHist');
  var tabs = document.querySelectorAll('.tab');

  if (!q || !go || !out) { return; }

  var DEMO_RC = { rc: 'GJ05RS0030', found: true, mobileNo: '7622868559', elapsed_ms: 0, demo_left: null };
  var DEMO_MOB = {
    mobileNo: '7622868559', found: true, count: 3, elapsed_ms: 0, demo_left: null,
    vehicles: [
      { stateCd:'GJ', regNo:'GJ05RS0030', stateName:'Gujarat', officeName:'SURAT(GJ5)', ishypothetical:false, regnUpto:'2037-07-04', fitUpto:'2037-07-04', insUpto:'2027-06-25', puccUpto:'2026-10-19' },
      { stateCd:'GJ', regNo:'GJ05FV6127', stateName:'Gujarat', officeName:'SURAT(GJ5)', ishypothetical:false, regnUpto:'2035-07-14', fitUpto:'2035-07-14', insUpto:'2026-11-26', puccUpto:'2027-06-10' },
      { stateCd:'GJ', regNo:'GJ05PJ2067', stateName:'Gujarat', officeName:'SURAT(GJ5)', ishypothetical:false, regnUpto:'2032-10-12', fitUpto:'2032-10-12', insUpto:'2027-06-20', puccUpto:'2027-06-19' }
    ]
  };

  /* ---------------- helpers ---------------- */

  function esc(v) {
    return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function cleanRC(v) { return String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }

  function validRC(rc) {
    if (!rc || rc.length < 8 || rc.length > 11) { return false; }
    if (/^[0-9]{2}BH[0-9]{4}[A-Z]{1,2}$/.test(rc)) { return true; }
    return /^[A-Z]{2}[0-9]{1,2}[A-Z]{1,3}[0-9]{1,4}$/.test(rc);
  }

  function cleanMobile(v) {
    var d = String(v || '').replace(/\D/g, '');
    if (d.length === 12 && d.slice(0, 2) === '91') { d = d.slice(2); }
    else if (d.length === 11 && d.charAt(0) === '0') { d = d.slice(1); }
    return d;
  }

  function validMobile(d) { return /^[6-9][0-9]{9}$/.test(d); }

  function fmtMobile(d) {
    return d && d.length === 10 ? '+91 ' + d.slice(0, 5) + ' ' + d.slice(5) : String(d || '');
  }

  function parseDate(s) {
    if (!s) { return null; }
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s));
    if (!m) { return null; }
    var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return isNaN(d.getTime()) ? null : d;
  }

  function dayDiff(d) {
    var n = new Date();
    var today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    return Math.round((d.getTime() - today.getTime()) / 86400000);
  }

  function statusOf(value) {
    var d = parseDate(value);
    if (!d) { return { cls: 'na', label: '\u2014', sub: '' }; }
    var n = dayDiff(d);
    var nice = d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    if (n < 0) { return { cls: 'bad', label: nice, sub: Math.abs(n) + ' days ago' }; }
    if (n === 0) { return { cls: 'warn', label: nice, sub: 'expires today' }; }
    if (n <= 60) { return { cls: 'warn', label: nice, sub: 'in ' + n + ' days' }; }
    return { cls: 'ok', label: nice, sub: 'in ' + (n / 365.25).toFixed(1) + ' years' };
  }

  function emptyBox(title, msg) {
    return '<div class="empty"><div class="t">' + esc(title) + '</div><div>' + esc(msg) + '</div></div>';
  }

  function skeleton() {
    return '<div class="card">'
      + '<div class="sk" style="width:36%;height:11px"></div>'
      + '<div class="sk" style="width:68%;height:24px;margin-top:13px"></div>'
      + '<div class="sk" style="width:50%;height:12px;margin-top:13px"></div>'
      + '<div class="sk" style="width:100%;height:38px;margin-top:16px"></div>'
      + '</div>';
  }

  function defaultHint(m) {
    return m === 'rc2m'
      ? 'RC number daalo, us par registered mobile number milega. Example: <button class="linkbtn" type="button" data-ex="GJ05RS0030">GJ05RS0030</button>'
      : 'Mobile number daalo, us par registered vehicles ki list milegi. Example: <button class="linkbtn" type="button" data-ex="7622868559">7622868559</button>';
  }

  function setHint(html, bad) {
    hint.innerHTML = html;
    hint.className = 'hint' + (bad ? ' bad' : '');
  }

  function isNetworkError(err) {
    if (!err) { return false; }
    if (err.name === 'AbortError') { return false; }
    return err.name === 'TypeError' || /failed to fetch|networkerror|load failed|network request failed/i.test(err.message || '');
  }

  function getJSON(url) {
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) { ctrl.abort(); } }, TIMEOUT_MS);
    var opts = { cache: 'no-store' };
    if (ctrl) { opts.signal = ctrl.signal; }
    return fetch(url, opts).then(function (res) {
      clearTimeout(timer);
      if (!res.ok) { throw new Error('HTTP ' + res.status); }
      return res.json();
    }, function (err) {
      clearTimeout(timer);
      throw err;
    });
  }

  /* ---------------- rendering ---------------- */

  function metaHtml(data, isDemo) {
    var parts = [];
    if (data && typeof data.elapsed_ms === 'number' && data.elapsed_ms > 0) {
      parts.push((data.elapsed_ms / 1000).toFixed(2) + 's');
    }
    if (data && typeof data.demo_left === 'number') {
      parts.push(data.demo_left + ' queries left');
    }
    if (isDemo) { parts.push('sample data \u00b7 api preview'); }
    if (!parts.length) { return ''; }
    return '<div class="meta">' + parts.map(function (p) { return '<span>' + esc(p) + '</span>'; }).join('') + '</div>';
  }

  function chip(label, value) {
    var s = statusOf(value);
    return '<div class="chip ' + s.cls + '">'
      + '<div class="cl">' + esc(label) + '</div>'
      + '<div class="cv">' + esc(s.label) + '</div>'
      + (s.sub ? '<div class="cs">' + esc(s.sub) + '</div>' : '')
      + '</div>';
  }

  function vehicleCard(v) {
    var reg = v.regNo ? String(v.regNo) : '\u2014';
    var sub = [v.stateName, v.officeName].filter(Boolean).map(esc).join(' &middot; ');
    var chips = [
      chip('Registration', v.regnUpto),
      chip('Fitness', v.fitUpto),
      chip('Insurance', v.insUpto),
      chip('PUCC', v.puccUpto)
    ];
    if (v.taxUpto) { chips.push(chip('Tax', v.taxUpto)); }
    if (v.permitUpto) { chips.push(chip('Permit', v.permitUpto)); }
    if (v.cngkitUpto) { chips.push(chip('CNG kit', v.cngkitUpto)); }
    if (v.vltdUpto) { chips.push(chip('VLTD', v.vltdUpto)); }

    return '<div class="vcard">'
      + '<div class="vhead">'
      +   '<div>'
      +     '<div class="reg mono">' + esc(reg) + '</div>'
      +     '<div class="vsub">' + (sub || '&mdash;') + '</div>'
      +   '</div>'
      +   '<div class="row">'
      +     (v.ishypothetical ? '<span class="badge">hypothetical</span>' : '')
      +     '<button class="btn sm ghost" type="button" data-copy="' + esc(reg) + '">copy</button>'
      +     '<button class="btn sm" type="button" data-rev="' + esc(reg) + '">rc &rarr; mobile</button>'
      +   '</div>'
      + '</div>'
      + '<div class="grid">' + chips.join('') + '</div>'
      + '</div>';
  }

  function renderRC(data, value, isDemo) {
    var mob = data && data.mobileNo !== null && data.mobileNo !== undefined ? String(data.mobileNo).replace(/\D/g, '') : '';
    if (!data || data.found === false || !mob) {
      out.innerHTML = emptyBox('Koi mobile number nahi mila', 'RC ' + value + ' ke against record nahi mila. Number ek baar check karke dobara try karo.');
      return;
    }
    out.innerHTML = '<div class="card">'
      + '<div class="k">Mobile number</div>'
      + '<div class="big mono">' + esc(fmtMobile(mob)) + '</div>'
      + '<div class="vsub">RC ' + esc(value) + ' ke against registered mobile</div>'
      + '<div class="actions">'
      +   '<button class="btn sm" type="button" data-copy="' + esc(mob) + '">copy number</button>'
      +   '<a class="btn sm ghost" href="tel:+91' + esc(mob) + '">call</a>'
      +   '<button class="btn sm ghost" type="button" data-rev="' + esc(mob) + '">mobile &rarr; rc</button>'
      + '</div>'
      + metaHtml(data, isDemo)
      + '</div>';
  }

  function renderMobile(data, value, isDemo) {
    var list = (data && Array.isArray(data.vehicles)) ? data.vehicles : [];
    if (!data || data.found === false || !list.length) {
      out.innerHTML = emptyBox('Koi vehicle nahi mila', 'Mobile ' + fmtMobile(value) + ' par koi vehicle registered nahi mila.');
      return;
    }
    var head = '<div class="k" style="margin-bottom:2px">'
      + list.length + (list.length > 1 ? ' vehicles' : ' vehicle') + ' registered \u00b7 ' + esc(fmtMobile(value))
      + '</div>';
    out.innerHTML = head + list.map(vehicleCard).join('') + metaHtml(data, isDemo);
  }

  /* ---------------- clipboard ---------------- */

  function fallbackCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'absolute';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  function copyText(text, btn) {
    var flash = function (ok) {
      if (!btn) { return; }
      var old = btn.textContent;
      btn.textContent = ok ? 'copied' : 'failed';
      setTimeout(function () { btn.textContent = old; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { flash(true); }, function () { flash(fallbackCopy(text)); });
    } else {
      flash(fallbackCopy(text));
    }
  }

  /* ---------------- history ---------------- */

  function readHist() {
    try {
      var raw = localStorage.getItem(HIST_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }

  function writeHist(arr) {
    try { localStorage.setItem(HIST_KEY, JSON.stringify(arr)); } catch (e) {}
  }

  function renderHist() {
    var arr = readHist();
    if (!arr.length) {
      histWrap.hidden = true;
      histBox.innerHTML = '';
      return;
    }
    histWrap.hidden = false;
    histBox.innerHTML = arr.map(function (x) {
      var label = x.m === 'm2rc' ? fmtMobile(x.v) : x.v;
      var dir = x.m === 'rc2m' ? 'rc &rarr; mobile' : 'mobile &rarr; rc';
      return '<button class="hchip" type="button" data-hm="' + esc(x.m) + '" data-hv="' + esc(x.v) + '">'
        + '<span class="mono">' + esc(label) + '</span><span class="dir">' + dir + '</span>'
        + '</button>';
    }).join('');
  }

  function pushHistory(m, v) {
    var arr = readHist().filter(function (x) { return !(x && x.m === m && x.v === v); });
    arr.unshift({ m: m, v: v });
    writeHist(arr.slice(0, MAX_HIST));
    renderHist();
  }

  /* ---------------- flow ---------------- */

  function setMode(m, silent) {
    mode = m;
    Array.prototype.forEach.call(tabs, function (tb) {
      var on = tb.getAttribute('data-mode') === m;
      tb.classList.toggle('active', on);
      tb.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    q.placeholder = m === 'rc2m' ? 'GJ05RS0030' : '7622868559';
    q.setAttribute('inputmode', m === 'm2rc' ? 'numeric' : 'text');
    if (!silent) { out.innerHTML = ''; }
    setHint(defaultHint(m));
  }

  function finish() {
    busy = false;
    go.disabled = false;
    go.textContent = 'Search';
  }

  function handleSuccess(data, value) {
    if (mode === 'rc2m') { renderRC(data, value, false); }
    else { renderMobile(data, value, false); }
    if (data && typeof data.demo_left === 'number') {
      quota.textContent = data.demo_left + ' queries left';
    }
    pushHistory(mode, value);
  }

  function handleFailure(err, value) {
    if (err && err.name === 'AbortError') {
      out.innerHTML = emptyBox('Timeout', 'API ne ' + (TIMEOUT_MS / 1000) + ' second me jawab nahi diya. Ek baar dobara try karo.');
      return;
    }
    if (isNetworkError(err)) {
      if (mode === 'rc2m') { renderRC(DEMO_RC, value, true); }
      else { renderMobile(DEMO_MOB, value, true); }
      pushHistory(mode, value);
      return;
    }
    out.innerHTML = emptyBox('Request fail hui', (err && err.message) ? err.message : 'unknown error');
  }

  function search() {
    if (busy) { return; }

    var raw = q.value.trim();
    var value = mode === 'rc2m' ? cleanRC(raw) : cleanMobile(raw);

    if (!value) {
      setHint(mode === 'rc2m' ? 'Pehle RC number likho, phir search dabao.' : 'Pehle mobile number likho, phir search dabao.', true);
      q.focus();
      return;
    }
    if (mode === 'rc2m' && !validRC(value)) {
      setHint('RC number theek nahi lag raha. Format aisa hona chahiye: <b>GJ05RS0030</b>', true);
      return;
    }
    if (mode === 'm2rc' && !validMobile(value)) {
      setHint('10 digit ka valid mobile number chahiye, jaise <b>7622868559</b>', true);
      return;
    }

    q.value = value;
    setHint(defaultHint(mode));

    busy = true;
    go.disabled = true;
    go.textContent = 'Searching';
    out.innerHTML = skeleton();

    var url = API
      + (mode === 'rc2m' ? '/rc-to-mobile?rc=' : '/mobile-to-rc?mobile=')
      + encodeURIComponent(value)
      + '&key=' + encodeURIComponent(KEY);

    getJSON(url).then(
      function (data) { try { handleSuccess(data, value); } finally { finish(); } },
      function (err) { try { handleFailure(err, value); } finally { finish(); } }
    );
  }

  /* ---------------- events ---------------- */

  Array.prototype.forEach.call(tabs, function (tb) {
    tb.addEventListener('click', function () {
      var m = tb.getAttribute('data-mode');
      if (m === mode) { q.focus(); return; }
      setMode(m, false);
      q.value = '';
      q.focus();
    });
  });

  go.addEventListener('click', search);

  q.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); search(); }
  });

  q.addEventListener('input', function () {
    if (mode !== 'rc2m') { return; }
    var v = q.value;
    var up = v.toUpperCase();
    if (up !== v) {
      var pos = q.selectionStart;
      q.value = up;
      try { q.setSelectionRange(pos, pos); } catch (e) {}
    }
  });

  hint.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-ex]') : null;
    if (!t) { return; }
    q.value = t.getAttribute('data-ex');
    search();
  });

  out.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-copy],[data-rev]') : null;
    if (!t) { return; }
    if (t.hasAttribute('data-copy')) {
      copyText(t.getAttribute('data-copy'), t);
      return;
    }
    var val = t.getAttribute('data-rev');
    var next = mode === 'rc2m' ? 'm2rc' : 'rc2m';
    setMode(next, true);
    q.value = val;
    search();
  });

  histBox.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-hm]') : null;
    if (!t) { return; }
    setMode(t.getAttribute('data-hm'), false);
    q.value = t.getAttribute('data-hv');
    search();
  });

  clearHistBtn.addEventListener('click', function () {
    writeHist([]);
    renderHist();
  });

  /* ---------------- init ---------------- */
  setMode('rc2m', false);
  renderHist();
})();
</script>

</body>
</html>
