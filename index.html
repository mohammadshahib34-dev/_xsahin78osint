<!-- language: HTML/JS, file: index.html, target: Browser -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Information Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
    .glass-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
  </style>
</head>
<body class="p-6 md:p-10 text-slate-800">

  <div class="max-w-6xl mx-auto space-y-8">
    
    <!-- Top Header -->
    <div class="flex justify-between items-center border-b pb-4 border-slate-200">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Info Lookup Dashboard</h1>
        <p class="text-slate-500 text-sm">Clean & fast multi-endpoint search dashboard</p>
      </div>
      <button onclick="toggleHistoryModal()" class="px-4 py-2 bg-slate-900 text-white rounded-lg text-sm font-medium hover:bg-slate-800 transition">
        📋 View Search History
      </button>
    </div>

    <!-- API Input Boxes Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <!-- 1. Number Info Box -->
      <div class="glass-card p-5 rounded-xl space-y-4">
        <h2 class="text-lg font-semibold text-slate-800 border-b pb-2">📱 Phone Number Info</h2>
        <input type="text" id="numInput" placeholder="Enter Mobile Number" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-slate-400">
        <button onclick="fetchInfo('number')" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-medium transition">Search Number</button>
      </div>

      <!-- 2. Aadhaar Info Box -->
      <div class="glass-card p-5 rounded-xl space-y-4">
        <h2 class="text-lg font-semibold text-slate-800 border-b pb-2">🪪 Aadhaar Details</h2>
        <input type="text" id="aadhaarInput" placeholder="Enter Aadhaar Number" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-slate-400">
        <button onclick="fetchInfo('aadhaar')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg text-sm font-medium transition">Search Aadhaar</button>
      </div>

      <!-- 3. Vehicle Info Box -->
      <div class="glass-card p-5 rounded-xl space-y-4">
        <h2 class="text-lg font-semibold text-slate-800 border-b pb-2">🚗 Vehicle Info</h2>
        <input type="text" id="vehicleInput" placeholder="Enter Vehicle Number (e.g. MH14ML9572)" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-slate-400">
        <button onclick="fetchInfo('vehicle')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg text-sm font-medium transition">Search Vehicle</button>
      </div>

    </div>

    <!-- Output Section with Side Copy Button -->
    <div id="outputSection" class="hidden space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="text-md font-semibold text-slate-700">Search Result:</h3>
        <button onclick="copyResult()" id="copyBtn" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-md text-xs font-medium transition">
          📄 Copy JSON Details
        </button>
      </div>
      <pre id="jsonDisplay" class="bg-slate-900 text-emerald-400 p-4 rounded-xl text-xs overflow-x-auto max-h-96 leading-relaxed"></pre>
    </div>

  </div>

  <!-- History Modal Window -->
  <div id="historyModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-xl">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-lg font-bold text-slate-800">Recent Search History</h3>
        <button onclick="toggleHistoryModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>
      <div id="historyList" class="space-y-2 max-h-80 overflow-y-auto text-sm text-slate-600">
        <!-- History items dynamically inserted here -->
      </div>
      <button onclick="clearHistory()" class="w-full py-2 text-xs text-red-600 border border-red-200 rounded-lg hover:bg-red-50">Clear History</button>
    </div>
  </div>

  <script>
    const API_KEY = "1Week";

    async function fetchInfo(type) {
      let url = "";
      let queryVal = "";

      if (type === 'number') {
        queryVal = document.getElementById("numInput").value.trim();
        url = `https://api.naxupdate.workers.dev/api/number-info?key=${API_KEY}&number=${queryVal}`;
      } else if (type === 'aadhaar') {
        queryVal = document.getElementById("aadhaarInput").value.trim();
        url = `https://api.naxupdate.workers.dev/api/aadhaar-info?key=${API_KEY}&aadhaar=${queryVal}`;
      } else if (type === 'vehicle') {
        queryVal = document.getElementById("vehicleInput").value.trim();
        url = `https://api.naxupdate.workers.dev/api/vahan?key=${API_KEY}&vechile=${queryVal}`;
      }

      if (!queryVal) return alert("Please enter input first!");

      document.getElementById("outputSection").classList.remove("hidden");
      document.getElementById("jsonDisplay").innerText = "Fetching details...";

      try {
        const res = await fetch(url);
        const data = await res.json();
        
        // Clean result display
        document.getElementById("jsonDisplay").innerText = JSON.stringify(data, null, 2);
        
        // Save to Local History
        saveToHistory(type, queryVal);

      } catch (err) {
        document.getElementById("jsonDisplay").innerText = "Error fetching data. Check CORS or API endpoint.";
      }
    }

    function copyResult() {
      const text = document.getElementById("jsonDisplay").innerText;
      navigator.clipboard.writeText(text);
      const btn = document.getElementById("copyBtn");
      btn.innerText = "✅ Copied!";
      setTimeout(() => btn.innerText = "📄 Copy JSON Details", 2000);
    }

    function saveToHistory(type, value) {
      let history = JSON.parse(localStorage.getItem("search_history") || "[]");
      history.unshift({ type, value, time: new Date().toLocaleTimeString() });
      if (history.length > 20) history.pop();
      localStorage.setItem("search_history", JSON.stringify(history));
    }

    function toggleHistoryModal() {
      const modal = document.getElementById("historyModal");
      modal.classList.toggle("hidden");
      if (!modal.classList.contains("hidden")) {
        loadHistoryList();
      }
    }

    function loadHistoryList() {
      const list = document.getElementById("historyList");
      let history = JSON.parse(localStorage.getItem("search_history") || "[]");
      if (history.length === 0) {
        list.innerHTML = "<p class='text-center py-4 text-slate-400'>No search history found.</p>";
        return;
      }
      list.innerHTML = history.map(item => `
        <div class="p-3 bg-slate-50 border border-slate-200 rounded-lg flex justify-between items-center">
          <div>
            <span class="text-xs uppercase font-bold text-slate-500">${item.type}</span>
            <p class="font-medium text-slate-800">${item.value}</p>
          </div>
          <span class="text-xs text-slate-400">${item.time}</span>
        </div>
      `).join("");
    }

    function clearHistory() {
      localStorage.removeItem("search_history");
      loadHistoryList();
    }
  </script>
</body>
</html>
